name: Release

# Triggered by plain semver tags (no "v" prefix): `git tag 0.1.0 && git push origin 0.1.0`; the tag must equal
# `project(OpenI76 VERSION ...)` in CMakeLists.txt.
# Builds the gasm module openi76-<version>.wasm and the gasm bundles (openi76.wasm + the released gasm-run,
# GASM_VERSION in tools/fetch-gasm-sdk.sh) for macOS, Linux x86_64/arm64 and Windows x86_64, smoke-tests each
# bundle on its own OS without game data, and attaches everything (with SHA-256 files) to a GitHub Release
# with .github/release-notes.md (when it exists) and generated notes. No native app and never any game data.
# workflow_dispatch builds the same files as artifacts only (version 0.0.0-snapshot.<sha>).

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:   # manual runs only; never on push to main

permissions:
  contents: write   # to create the Release and upload assets

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="$GITHUB_REF_NAME"
            grep -Eq "^project\(OpenI76 VERSION $v( |\))" CMakeLists.txt ||
              { echo "tag $v does not match project(OpenI76 VERSION ...) in CMakeLists.txt" >&2; exit 1; }
          else
            v="0.0.0-snapshot.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: build openi76.wasm
        run: |
          cmake -S . -B build-gasm -DOPENI76_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk"
          cmake --build build-gasm -j
          name="openi76-${{ steps.ver.outputs.version }}.wasm"
          cp build-gasm/openi76.wasm "$name"
          sha256sum "$name" > "$name.sha256"
          ls -l "$name"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openi76-wasm
          path: openi76-*.wasm*
          retention-days: 14

  gasm-macos:
    needs: wasm
    runs-on: macos-latest   # iconutil, codesign (ad hoc)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openi76-wasm
          path: wasm
      - name: package
        run: |
          v=$(basename wasm/openi76-*.wasm .wasm); v=${v#openi76-}
          OPENI76_WASM=$(ls wasm/openi76-*.wasm) tools/package-gasm.sh "$v" macos-universal \
            "$(tools/fetch-gasm-runner.sh macos-universal)" dist
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/openi76-gasm-*-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openi76-gasm-macos-universal
          path: dist/openi76-gasm-*.zip*
          retention-days: 14

  gasm-package:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openi76-wasm
          path: wasm
      - name: package (Linux x86_64 and arm64, Windows x86_64)
        run: |
          v=$(basename wasm/openi76-*.wasm .wasm); v=${v#openi76-}
          for p in linux-x86_64 linux-arm64 windows-x86_64; do
            OPENI76_WASM=$(ls wasm/openi76-*.wasm) tools/package-gasm.sh "$v" "$p" "$(tools/fetch-gasm-runner.sh "$p")" "dist/$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openi76-gasm-linux-x86_64
          path: dist/linux-x86_64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: openi76-gasm-linux-arm64
          path: dist/linux-arm64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: openi76-gasm-windows-x86_64
          path: dist/windows-x86_64/*
          retention-days: 14

  gasm-smoke-linux:
    needs: gasm-package
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openi76-gasm-linux-${{ matrix.arch }}
          path: dist
      - name: runtime libraries (ALSA)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2t64
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/openi76-gasm-*-linux-${{ matrix.arch }}.tar.gz

  gasm-smoke-windows:
    needs: gasm-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openi76-gasm-windows-x86_64
          path: dist
      - name: smoke test (no game data)
        shell: pwsh
        env:
          OPENI76_NO_PAUSE: '1'
        run: |
          $zip = Get-ChildItem dist/openi76-gasm-*-windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $d = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          foreach ($f in 'gasm-run.exe', 'openi76.wasm', 'OpenI76.cmd', 'openi76.ps1', 'README.txt', 'LICENSE.txt', 'LICENSE-gasm.txt') {
            if (-not (Test-Path (Join-Path $d $f))) { throw "missing $f" }
          }
          # No data: OpenI76's clean error, exit code 1 (not a crash).
          $out = & "$d\gasm-run.exe" "$d\openi76.wasm" --headless 5 --mute 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          if ($rc -ne 1) { throw "gasm-run without data: exit $rc, expected 1" }
          if ($out -notmatch 'game data not found') { throw "no 'game data not found' message" }
          # The launcher (no dialogs: OPENI76_GAME / --dry-run, scratch APPDATA and LOCALAPPDATA).
          $env:APPDATA = Join-Path $PWD 'appdata'; $env:LOCALAPPDATA = Join-Path $PWD 'localappdata'
          $help = & "$d\OpenI76.cmd" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'OpenI76') { throw '--help' }
          # fakes: disc 1's files (a space in the path), an installed game, an image (goes to the game as asset cd), and what must be refused.
          # A fake I76.EXE is 1,019,392 zero bytes: the launcher checks the size only.
          New-Item -ItemType Directory -Force 'my cd', installed, empty, wrongexe, nozfs, noexe | Out-Null
          New-Item -ItemType File -Force 'my cd\I76.ZFS', 'installed\I76.ZFS', 'wrongexe\I76.EXE', 'wrongexe\I76.ZFS', 'noexe\I76.ZFS', 'I76 CD1.iso', I76.cue | Out-Null
          foreach ($e in 'my cd\I76.EXE', 'installed\I76.EXE', 'nozfs\I76.EXE') {
            $f = [IO.File]::Create((Join-Path $PWD $e)); $f.SetLength(1019392); $f.Close()
          }
          $env:OPENI76_GAME = Join-Path $PWD 'installed'
          $cmd = & "$d\OpenI76.cmd" --dry-run | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch '--asset-dir') { throw 'dry run with an installed folder' }
          $env:OPENI76_GAME = Join-Path $PWD 'my cd'
          $cmd = & "$d\OpenI76.cmd" --dry-run --mute | Out-String
          $cmd
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch '--asset-dir' -or $cmd -notmatch '--mute') { throw "dry run with disc 1's files" }
          $env:OPENI76_GAME = Join-Path $PWD 'I76 CD1.iso'
          $cmd = & "$d\OpenI76.cmd" --dry-run | Out-String
          $cmd
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch 'cd=' -or $cmd -match '--asset-dir') { throw 'dry run with an .iso' }
          foreach ($bad in 'empty', 'wrongexe', 'nozfs', 'noexe', 'I76.cue', 'missing') {
            $env:OPENI76_GAME = Join-Path $PWD $bad
            & "$d\OpenI76.cmd" --dry-run 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 2) { throw "$bad accepted (exit $LASTEXITCODE, expected 2)" }
          }
          if (Test-Path (Join-Path $env:APPDATA 'OpenI76\data-location')) { throw 'a dry run saved the data location' }
          $global:LASTEXITCODE = 0
          'PASS'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wasm, gasm-macos, gasm-package, gasm-smoke-linux, gasm-smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts
          notes=(); [ -f .github/release-notes.md ] && notes=(--notes-file .github/release-notes.md)
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "OpenI76 $GITHUB_REF_NAME" \
            "${notes[@]}" --generate-notes
