<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="A desert road at sunset running to the horizon between mesas">
  <!-- The site's own hero, drawn for the site in the spirit of the game's 1970s south-west (nothing from the
       game's artwork): a striped sunset sun over mesas and a road whose centre line rushes towards the
       viewer. CSS animation, still for visitors who prefer reduced motion. -->
  <style>
    .dash { transform-origin: 280px 236px; animation: drive 2.4s cubic-bezier(.6, 0, .96, .55) infinite; }
    .d2 { animation-delay: -.6s; } .d3 { animation-delay: -1.2s; } .d4 { animation-delay: -1.8s; }
    @keyframes drive { from { transform: scale(.02); } to { transform: scale(1.9); } }
    .post { transform-origin: 280px 236px; animation: drive 2.4s cubic-bezier(.6, 0, .96, .55) infinite; }
    .p2 { animation-delay: -1.2s; }
    .rays { transform-origin: 280px 196px; animation: turn 60s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .haze { animation: shimmer 3s ease-in-out infinite alternate; }
    @keyframes shimmer { from { opacity: .35; } to { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { .dash, .post, .rays, .haze { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b5c"/>
      <stop offset=".38" stop-color="#b3345a"/>
      <stop offset=".72" stop-color="#f26a21"/>
      <stop offset="1" stop-color="#ffc04a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".6" stop-color="#ffc23a"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3d1c"/>
      <stop offset=".35" stop-color="#b55a26"/>
      <stop offset="1" stop-color="#6b2a12"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a3e"/>
      <stop offset="1" stop-color="#1f1a22"/>
    </linearGradient>
    <clipPath id="box"><rect width="560" height="420" rx="18"/></clipPath>
    <clipPath id="below"><rect y="236" width="560" height="184"/></clipPath>
    <clipPath id="onroad"><polygon points="276,236 284,236 470,420 90,420"/></clipPath>
    <!-- the sun's bands: wider gaps towards the horizon, as on a 1970s sticker -->
    <mask id="bands">
      <rect width="560" height="420" fill="#fff"/>
      <rect x="150" y="170" width="260" height="5" fill="#000"/>
      <rect x="150" y="186" width="260" height="7" fill="#000"/>
      <rect x="150" y="203" width="260" height="9" fill="#000"/>
      <rect x="150" y="221" width="260" height="11" fill="#000"/>
    </mask>
    <g id="ray"><polygon points="280,196 272,-260 288,-260" fill="#ffe7a3" opacity=".16"/></g>
  </defs>
  <g clip-path="url(#box)">
    <rect width="560" height="420" fill="url(#sky)"/>
    <g class="rays">
      <use href="#ray"/><use href="#ray" transform="rotate(20 280 196)"/><use href="#ray" transform="rotate(40 280 196)"/>
      <use href="#ray" transform="rotate(60 280 196)"/><use href="#ray" transform="rotate(80 280 196)"/>
      <use href="#ray" transform="rotate(100 280 196)"/><use href="#ray" transform="rotate(120 280 196)"/>
      <use href="#ray" transform="rotate(140 280 196)"/><use href="#ray" transform="rotate(160 280 196)"/>
      <use href="#ray" transform="rotate(180 280 196)"/><use href="#ray" transform="rotate(200 280 196)"/>
      <use href="#ray" transform="rotate(220 280 196)"/><use href="#ray" transform="rotate(240 280 196)"/>
      <use href="#ray" transform="rotate(260 280 196)"/><use href="#ray" transform="rotate(280 280 196)"/>
      <use href="#ray" transform="rotate(300 280 196)"/><use href="#ray" transform="rotate(320 280 196)"/>
      <use href="#ray" transform="rotate(340 280 196)"/>
    </g>
    <circle cx="280" cy="196" r="96" fill="url(#sun)" mask="url(#bands)"/>

    <!-- the far mesas, then the near ones -->
    <path d="M0,236 L0,214 L38,214 L48,202 L104,202 L112,214 L150,214 L150,236 Z" fill="#6e2a4a"/>
    <path d="M360,236 L372,206 L418,206 L426,196 L476,196 L486,210 L560,210 L560,236 Z" fill="#6e2a4a"/>
    <path d="M0,236 L0,190 L22,190 L30,176 L70,176 L80,196 L96,224 L130,236 Z" fill="#45163a"/>
    <path d="M412,236 L444,200 L452,178 L508,178 L516,192 L560,192 L560,236 Z" fill="#45163a"/>

    <rect y="236" width="560" height="184" fill="url(#ground)"/>
    <rect class="haze" y="232" width="560" height="10" fill="#ffd27a" opacity=".45"/>
    <!-- the road, its edge lines and the centre line driving at the viewer -->
    <polygon points="276,236 284,236 470,420 90,420" fill="url(#road)"/>
    <polygon points="276,236 278,236 116,420 98,420" fill="#ffc23a" opacity=".85"/>
    <polygon points="282,236 284,236 462,420 444,420" fill="#ffc23a" opacity=".85"/>
    <g clip-path="url(#onroad)">
      <polygon class="dash" points="274,300 286,300 290,350 270,350" fill="#fff3c4"/>
      <polygon class="dash d2" points="274,300 286,300 290,350 270,350" fill="#fff3c4"/>
      <polygon class="dash d3" points="274,300 286,300 290,350 270,350" fill="#fff3c4"/>
      <polygon class="dash d4" points="274,300 286,300 290,350 270,350" fill="#fff3c4"/>
    </g>
    <!-- roadside posts going by -->
    <g clip-path="url(#below)">
      <g class="post"><rect x="150" y="262" width="6" height="34" fill="#2a1b2e"/><rect x="150" y="262" width="6" height="6" fill="#ff5a3a"/></g>
      <g class="post p2"><rect x="404" y="262" width="6" height="34" fill="#2a1b2e"/><rect x="404" y="262" width="6" height="6" fill="#ff5a3a"/></g>
    </g>
    <!-- saguaros -->
    <g fill="#2a1b2e">
      <path d="M60,300 v-58 a7,7 0 0 1 14,0 v58 z M60,272 h-12 v-16 a5,5 0 0 1 10,0 v8 h2 z M74,266 h12 v-20 a5,5 0 0 0 -10,0 v12 h-2 z"/>
      <path d="M500,284 v-40 a5,5 0 0 1 10,0 v40 z M500,264 h-8 v-12 a4,4 0 0 1 8,0 v6 z M510,260 h8 v-14 a4,4 0 0 0 -8,0 v8 z"/>
    </g>
  </g>
</svg>
