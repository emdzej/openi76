<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="OpenI76">
  <!-- The site's own hero, after the cover's composition: a burst of sunset rays behind a yellow and blue
       oval with heavy italic lettering. Drawn for the site; nothing from the game's artwork. -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="52%" r="60%">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset=".45" stop-color="#ffa52b"/>
      <stop offset=".8" stop-color="#f26a21"/>
      <stop offset="1" stop-color="#d6331b"/>
    </radialGradient>
    <clipPath id="box"><rect x="0" y="0" width="560" height="420" rx="18"/></clipPath>
    <g id="ray"><polygon points="280,218 268,-200 292,-200" fill="#fff3c4" opacity=".28"/></g>
  </defs>
  <g clip-path="url(#box)">
    <rect width="560" height="420" fill="url(#sun)"/>
    <g>
      <use href="#ray"/><use href="#ray" transform="rotate(15 280 218)"/><use href="#ray" transform="rotate(30 280 218)"/>
      <use href="#ray" transform="rotate(45 280 218)"/><use href="#ray" transform="rotate(60 280 218)"/>
      <use href="#ray" transform="rotate(75 280 218)"/><use href="#ray" transform="rotate(90 280 218)"/>
      <use href="#ray" transform="rotate(105 280 218)"/><use href="#ray" transform="rotate(120 280 218)"/>
      <use href="#ray" transform="rotate(135 280 218)"/><use href="#ray" transform="rotate(150 280 218)"/>
      <use href="#ray" transform="rotate(165 280 218)"/><use href="#ray" transform="rotate(180 280 218)"/>
      <use href="#ray" transform="rotate(195 280 218)"/><use href="#ray" transform="rotate(210 280 218)"/>
      <use href="#ray" transform="rotate(225 280 218)"/><use href="#ray" transform="rotate(240 280 218)"/>
      <use href="#ray" transform="rotate(255 280 218)"/><use href="#ray" transform="rotate(270 280 218)"/>
      <use href="#ray" transform="rotate(285 280 218)"/><use href="#ray" transform="rotate(300 280 218)"/>
      <use href="#ray" transform="rotate(315 280 218)"/><use href="#ray" transform="rotate(330 280 218)"/>
      <use href="#ray" transform="rotate(345 280 218)"/>
    </g>
    <!-- the road running out of the burst -->
    <polygon points="250,250 310,250 520,420 40,420" fill="#4a4652" opacity=".85"/>
    <polygon points="276,262 284,262 300,300 260,300" fill="#ffdf1e"/>
    <polygon points="252,330 268,330 262,420 222,420" fill="#ffdf1e" transform="translate(46 0)"/>
  </g>
  <g transform="rotate(-8 280 190)">
    <ellipse cx="280" cy="190" rx="250" ry="112" fill="#ffdf1e" stroke="#15131f" stroke-width="7"/>
    <ellipse cx="280" cy="190" rx="214" ry="88" fill="#1d4fae" stroke="#15131f" stroke-width="5"/>
    <ellipse cx="280" cy="190" rx="188" ry="70" fill="#f26a21" stroke="#15131f" stroke-width="4"/>
    <g font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-style="italic" text-anchor="middle"
       stroke="#15131f" stroke-linejoin="round" paint-order="stroke">
      <text x="292" y="176" font-size="78" fill="#15131f" stroke-width="14">Open</text>
      <text x="286" y="170" font-size="78" fill="#ffdf1e" stroke-width="7">Open</text>
      <text x="300" y="262" font-size="112" fill="#15131f" stroke-width="16">I'76</text>
      <text x="293" y="255" font-size="112" fill="#ffffff" stroke-width="8">I'76</text>
    </g>
  </g>
</svg>
